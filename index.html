<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>내 게임</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; touch-action: none; }
    html, body { width: 100%; height: 100dvh; }
    #game-container { touch-action: none; }
</style>
</head>
<body>
  <div id="game-container" style="width: 100vw; height: 100dvh; display: flex; justify-content: center; align-items: center;"></div>
  <script>
    // 모바일에서 접속 시 주소창이 자동으로 스크롤되어 숨겨지도록 유도
    window.addEventListener('load', () => {
      setTimeout(() => window.scrollTo(0, 1), 100);
    });
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
